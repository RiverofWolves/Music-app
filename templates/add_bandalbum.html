{% extends "base.html" %}
{% block title %} {{super()}} - Add Album to Band {% endblock %}
{% block content %}
<h2>Assign Album to Band</h2>
<form method="post" id="bandalbum">
<label>Band:</label>
<select name="bandid">
    <option value="">-- select band --</option>
    {% for band in bands %}
    <option value="{{ band.BandID }}">{{ band.BandName }}</option>
    {% endfor %}
    </select><br />
    <label>Album:</label>
    <select name="albumid">
    <option value="">-- select member --</option>
    {% for album in albums %}
    <option value="{{ album.AlbumID }}">{{ album.AlbumTitle }}</option>
    {% endfor %}
    </select><br />
    <label>Role:</label><input type="text" name="role" /><br /> 
    <button type="submit">Save Album</button>
</form>
{% endblock %}
